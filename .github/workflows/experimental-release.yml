name: "Experimental Release"

concurrency: experimental-release

on:
  push:
    branches:
      - main
    paths-ignore: [docs/**, scripts/**, "**.md", "**.mdx"]

jobs:
  metadata:
    uses: ./.github/workflows/registry-mods-summary.yml

  build-translations:
    uses: ./.github/workflows/build-translations.yml
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  builds:
    needs: build-translations
    uses: ./.github/workflows/build.yml
    with:
      version-label: experimental
      upload-to-release: true
      # CBN-Coop fork: only the Windows build; delete matrix-json to build every platform again.
      matrix-json: |
        [
          { "name": "Windows MSVC", "platform": "windows", "artifact": "windows-tiles-x64-msvc", "os": "windows-2022", "arch": "x64", "tiles": true, "sound": true, "ext": "zip", "content-type": "application/zip" }
        ]
    secrets: inherit
